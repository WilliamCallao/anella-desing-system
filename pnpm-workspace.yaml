packages:
  - 'apps/*'
  - 'packages/*'

# React Native + Expo en monorepo: el linker hoisted evita dependencias
# nativas duplicadas y problemas clásicos de resolución con pnpm.
nodeLinker: hoisted

# Resolver siempre a los paquetes del workspace aunque se declaren por rango
# (^0.0.0) para que npm/apps externas puedan instalarlos por file:.
linkWorkspacePackages: true
preferWorkspacePackages: true

# pnpm 10 bloquea los build scripts por defecto. esbuild lo necesita para
# instalar su binario nativo (lo usa tsup para el build de los paquetes) y
# @shopify/react-native-skia para compilar sus bindings nativos. better-sqlite3
# lo necesita para compilar su binding nativo (devDep de @william-callao/antonella-sync,
# usada solo por los tests del core).
onlyBuiltDependencies:
  - esbuild
  - '@shopify/react-native-skia'
  - better-sqlite3
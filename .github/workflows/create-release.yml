name: Create GitHub Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  create-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version from package.json
        id: version
        run: |
          PKG_VERSION=$(node -p "require('./packages/ui/package.json').version")
          echo "tag=v${PKG_VERSION}" >> "$GITHUB_OUTPUT"
          echo "El tag será v${PKG_VERSION} (desde packages/ui/package.json)"

      - name: Check tag exists
        id: tag_check
        run: |
          if git rev-parse -q --verify "refs/tags/${{ steps.version.outputs.tag }}" > /dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "El tag ${{ steps.version.outputs.tag }} ya existe. No se crea nada."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build release notes
        id: notes
        if: steps.tag_check.outputs.exists == 'false'
        run: |
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || true)
          if [ -n "${LAST_TAG}" ]; then
            RANGE="${LAST_TAG}..HEAD"
          else
            RANGE="HEAD"
          fi

          {
            echo "## Features"
            echo ""
            git log --no-merges --pretty=format:"%s" "${RANGE}" | grep -E '^feat' || echo "_Ninguna_"
            echo ""
            echo "## Bug fixes"
            echo ""
            git log --no-merges --pretty=format:"%s" "${RANGE}" | grep -E '^fix' || echo "_Ninguno_"
            echo ""
            echo "## Otros cambios"
            echo ""
            git log --no-merges --pretty=format:"- %s" "${RANGE}" | grep -vE '^(feat|fix)' || echo "_Ninguno_"
            echo ""
            echo "Ciclo cubierto: \`${RANGE}\`"
          } > NOTES.md

      - name: Preview notes
        if: steps.tag_check.outputs.exists == 'false'
        run: cat NOTES.md

      - name: Create tag and GitHub Release
        if: steps.tag_check.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git tag "${{ steps.version.outputs.tag }}"
          git push origin "${{ steps.version.outputs.tag }}"
          gh release create "${{ steps.version.outputs.tag }}" \
            --repo "$GITHUB_REPOSITORY" \
            --title "${{ steps.version.outputs.tag }}" \
            --notes-file NOTES.md